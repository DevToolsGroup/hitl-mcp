<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HITL MCP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Tool call review</h1>
    <span id="connection" class="connection offline">connecting…</span>
</header>

<!-- Shown only with ?devmode=true in the URL: drives one fake card without a server. -->
<section id="dev-panel" class="dev-panel" hidden>
    <label>
        Test input
        <textarea id="dev-input" rows="3" placeholder="Tool input; non-empty text creates the card"></textarea>
    </label>
    <label>
        Test output
        <textarea id="dev-output" rows="3" placeholder="Tool output; non-empty text moves the card to result review"></textarea>
    </label>
    <label class="dev-executing">
        <input type="checkbox" id="dev-executing">
        Executing
    </label>
</section>

<main>
    <p id="empty" class="empty">No pending calls.</p>
    <div id="cards"></div>
</main>

<template id="card-template">
    <section class="card">
        <div class="card-head">
            <span class="phase"></span>
            <span class="tool"></span>
            <span class="time"></span>
            <span class="id"></span>
        </div>

        <div class="block-head">
            <h3>Input</h3>
            <select class="attribute input-attribute" title="Show only the value of this top-level attribute"
                    hidden></select>
            <button class="copy" title="Copy the text shown below">Copy</button>
        </div>
        <div class="paged input">
            <pre></pre>
            <div class="pager" hidden>
                <button class="prev" title="Previous page">&lsaquo;</button>
                <span class="page-info"></span>
                <button class="next" title="Next page">&rsaquo;</button>
            </div>
        </div>

        <div class="output-block" hidden>
            <div class="block-head">
                <h3 class="output-title">Result</h3>
                <select class="attribute output-attribute" title="Show only the value of this top-level attribute"
                        hidden></select>
                <button class="copy" title="Copy the text shown below">Copy</button>
            </div>
            <div class="paged output">
                <pre></pre>
                <div class="pager" hidden>
                    <button class="prev" title="Previous page">&lsaquo;</button>
                    <span class="page-info"></span>
                    <button class="next" title="Next page">&rsaquo;</button>
                </div>
            </div>

            <h3>Reviewer updated result</h3>
            <textarea class="updated-result" rows="4"
                      placeholder="Replacement for the result (optional, sent to the agent instead of the result above)"></textarea>
        </div>

        <div class="controls">
            <div class="buttons">
                <button class="accept">Accept input</button>
                <button class="deny">Deny input</button>
            </div>
            <textarea class="reason" rows="2" placeholder="Reason for denial (optional, sent to the agent)"></textarea>
        </div>
    </section>
</template>

<script src="app.js"></script>
</body>
</html>
