spring.application.name=hitl-mcp-server

# Localhost only
server.address=127.0.0.1
server.port=8080

# Many tool calls may block at the same time waiting for the user
spring.threads.virtual.enabled=true

# MCP server, Streamable HTTP transport at /mcp
spring.ai.mcp.server.name=hitl-mcp-server
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.type=sync
spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
# Tools come from ToolsConfig, not from @McpTool annotations
spring.ai.mcp.server.annotation-scanner.enabled=false

# History of finished invocations (JSON Lines)
app.history.file=log/call-history.jsonl
# Max characters of tool input stored in history
app.history.input-max-chars=2000
# Max characters of tool output stored in history
app.history.output-max-chars=2000
